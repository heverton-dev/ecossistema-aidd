# ============================================================================
# ECOSSISTEMA AIDD — QUALITY GATES via PRE-COMMIT (NIH #4 / Fase 2-Gates3)
# ============================================================================
# Substitui o runner proprio dos quality gates ('python ecossistema.py audit')
# pelo framework pre-commit. Cada gate gates/G_*.py vira um hook abaixo.
#
# Todos os hooks sao LOCAIS (repo: local, language: system) => hermetico,
# zero download de repos remotos, funciona offline e em qualquer harness/SO
# (Regra de Ouro 6 — Supremacia Agnóstica).
#
# PLAN-0018 fase 04 (pin-exato-e-hashes): como os hooks sao 'language: system',
# eles rodam no Python ambiente que voce ja tem — o pre-commit em si (e as
# libs usadas pelos gates, ex.: pyyaml/checkov) precisam vir do
# requirements-dev.lock, instalado com verificacao de hash obrigatoria:
#   pip install --require-hashes -r requirements-dev.lock
# Nunca instale a partir de requirements-dev.txt direto (sem hash) para rodar
# estes hooks. Auditado por gates/G_DEPENDENCIAS_PIN_HASH.py.
#
# Regras de gatilho:
#   * always_run: true   -> checagem de repo inteiro em TODO commit.
#   * files: ^tools/     -> roda so quando um arquivo staged bate no padrao
#                           (G_TESTES_REAIS roda pytest real -> so quando
#                           tools/** muda; o 'audit' roda --all-files e
#                           portanto sempre o executa).
#   * stages: [manual]   -> NAO roda no commit nem no 'audit' padrao; roda
#                           explicitamente via:
#                           pre-commit run --hook-stage manual <id> --all-files
#
# Status honesto de cada gate (ver gates/):
#   - Os 10 gates do 'audit' estao em stages pre-commit: 9 verdes (always_run)
#     + G_TESTES_REAIS (files: ^tools/).
#
#   - G_SEGREDOS reativado com 'always_run: true' em 2026-09-19 (ISSUE-0002 e ISSUE-0003, Rota A):
#     * Todos os 31 alertas triados individualmente como falsos positivos e auditados
#       oficialmente no .secrets.baseline (via scan + audit do detect-secrets).
#     * Causa raiz da disparidade historica de 2026-09-08 esclarecida: detect-secrets
#       exige que o baseline esteja staged (raise_exception_if_baseline_file_is_unstaged)
#       e que a lista de arquivos rastreados passe completa para o scan com merge.
#     * Revalidado com exit 0 tanto no hook quanto na execucao direta.

default_install_hook_types: [pre-commit]
default_stages: [pre-commit, manual]
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: g-ecossistema-integridade
        name: G_ECOSSISTEMA_INTEGRIDADE (ferramentas/skills/commands/AST)
        entry: python gates/G_ECOSSISTEMA_INTEGRIDADE.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-drift-nucleo-compartilhado
        name: G_DRIFT_NUCLEO_COMPARTILHADO (nucleo master vs enterprise)
        entry: python gates/G_DRIFT_NUCLEO_COMPARTILHADO.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-harness-compat
        name: G_HARNESS_COMPAT (artefatos multi-harness sincronizados)
        entry: python gates/G_HARNESS_COMPAT.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-universal-harness
        name: G_UNIVERSAL_HARNESS (paridade universal de skills, mcps e hooks)
        entry: python gates/G_UNIVERSAL_HARNESS.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-segredos
        name: G_SEGREDOS (detect-secrets sobre git ls-files vs baseline)
        entry: python gates/G_SEGREDOS.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-cli-help-consistencia
        name: G_CLI_HELP_CONSISTENCIA (flags citadas vs add_argument)
        entry: python gates/G_CLI_HELP_CONSISTENCIA.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-componente-agnostico
        name: G_COMPONENTE_AGNOSTICO (componentes vs manifesto de harnesses)
        entry: python gates/G_COMPONENTE_AGNOSTICO.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-zero-headless
        name: G_ZERO_HEADLESS (modo interativo obrigatorio / zero headless)
        entry: python gates/G_ZERO_HEADLESS.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-infra-compose
        name: G_INFRA_COMPOSE (compose e init sql estaticos do aidd-ops)
        entry: python gates/G_INFRA_COMPOSE.py
        # AMBIENTE ISOLADO (2026-09-19): 'language: python' faz o pre-commit criar um
        # venv proprio para este hook, com as dependencias abaixo. Motivo: checkov
        # exige importlib-metadata<8 e o litellm sem vulnerabilidades conhecidas exige
        # >=8 — os dois nao cabem na mesma instalacao. Isolando o checkov aqui, o
        # requirements.txt pode fixar um litellm corrigido sem perder a auditoria de
        # compose. O gate prefere o executavel do PATH (que este venv fornece) e so
        # cai para o modulo do Python corrente como ultimo recurso.
        language: python
        additional_dependencies:
          - checkov==3.3.19
          - pyyaml==6.0.3
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-hadolint
        name: G_HADOLINT (melhores praticas OCI via Hadolint)
        entry: python gates/G_HADOLINT.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-testes-reais
        name: G_TESTES_REAIS (pytest real por ferramenta em tools/)
        entry: python gates/G_TESTES_REAIS.py
        language: system
        files: ^tools/
        pass_filenames: false
        require_serial: true

      - id: g-dependencias-pin-hash
        name: G_DEPENDENCIAS_PIN_HASH (pin exato + hash criptografico em requirements)
        entry: python gates/G_DEPENDENCIAS_PIN_HASH.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-honestidade-rotulo
        name: G_HONESTIDADE_ROTULO (termos de marketing proibidos em gates)
        entry: python gates/G_HONESTIDADE_ROTULO.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-arquitetura-deliverable
        name: G_ARQUITETURA_DELIVERABLE (Clean Arch / DDD nos deliverables)
        entry: python gates/G_ARQUITETURA_DELIVERABLE.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-frontend-layers
        name: G_FRONTEND_LAYERS (separacao de camadas UI vs rede no frontend)
        entry: python gates/G_FRONTEND_LAYERS.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-isolation-audit
        name: G_ISOLATION_AUDIT (auditoria estrita de isolamento inter-fatias VSA)
        entry: python gates/G_ISOLATION_AUDIT.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-protocol-fallback
        name: G_PROTOCOL_FALLBACK (paridade e fallback REST vs MCP)
        entry: python gates/G_PROTOCOL_FALLBACK.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-llm-prompt-shield
        name: G_LLM_PROMPT_SHIELD (auditoria de blindagem anti-prompt injection)
        entry: python gates/G_LLM_PROMPT_SHIELD.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-drift-analyzer
        name: G_DRIFT_ANALYZER (analise de redundancia funcional inter-fatias VSA)
        entry: python gates/G_DRIFT_ANALYZER.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-prototype-rewrite
        name: G_PROTOTYPE_REWRITE (isolamento de sandbox e trava anti-vibe coding)
        entry: python gates/G_PROTOTYPE_REWRITE.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-livro-evidencia
        name: G_LIVRO_EVIDENCIA (auditoria de evidencia do livro-texto)
        entry: python gates/G_LIVRO_EVIDENCIA.py
        language: system
        stages: [manual]
        pass_filenames: false
        require_serial: true

      - id: g-portao-prova-que-morde
        name: "G_PORTAO_PROVA_QUE_MORDE (meta-gate: bloqueia gates sem teste de reprovação exit 1)"
        entry: python gates/G_PORTAO_PROVA_QUE_MORDE.py
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: g-lei-declara-portao
        name: "G_LEI_DECLARA_PORTAO (meta-gate: bloqueia leis sem portao declarado e forca)"
        entry: python gates/G_LEI_DECLARA_PORTAO.py
