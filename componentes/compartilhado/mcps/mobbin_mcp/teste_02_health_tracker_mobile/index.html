<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aura Health & Biomarkers — Mobile PWA</title>
  <meta name="theme-color" content="#090d16" id="meta-theme-color">
  <style>
    /* ==========================================================================
       CONTRATO DUAL — ARQUÉTIPO MOBILE_CARD_FEED & BIOMARKERS (WHOOP / OURA STYLE)
       Paleta: Emerald Bio, Cyan Vital, Slate Deep | 100% SVG | Safe Areas
       ========================================================================== */
    :root {
      --bg-canvas: #090d16;
      --bg-surface: #0f172a;
      --bg-card: #141e33;
      --bg-pill: #1e293b;
      --bg-tabbar: rgba(15, 23, 42, 0.94);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-title: #ffffff;

      --color-vital: #10b981;
      --color-accent: #06b6d4;
      --color-warning: #f59e0b;
      --color-stress: #ec4899;

      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-card: rgba(255, 255, 255, 0.12);

      --touch-target-min: 48px;
      --safe-top: env(safe-area-inset-top, 24px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    :root[data-theme="light"],
    body[data-theme="light"] {
      --bg-canvas: #f0fdf4;
      --bg-surface: #ffffff;
      --bg-card: #f8fafc;
      --bg-pill: #e2e8f0;
      --bg-tabbar: rgba(255, 255, 255, 0.96);

      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-title: #0f172a;

      --color-vital: #059669;
      --color-accent: #0891b2;
      --color-warning: #d97706;
      --color-stress: #db2777;

      --border-subtle: #e2e8f0;
      --border-card: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .app-viewport {
      width: 100%;
      min-height: 100vh;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-top: var(--safe-top);
      padding-bottom: calc(72px + var(--safe-bottom));
      transition: background 0.15s ease;
    }

    @media (min-width: 640px) {
      body { padding: 32px 16px; align-items: center; }
      .app-viewport {
        max-width: 460px;
        min-height: 860px;
        border-radius: 36px;
        border: 1px solid var(--border-card);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
    }

    .app-header {
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .date-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-vital);
      font-family: var(--font-mono);
    }

    .header-actions { display: flex; gap: 10px; }

    .btn-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .btn-circle:active { transform: scale(0.92); }

    .svg-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Anel de Recuperação / Strain Card */
    .recovery-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .score-info { display: flex; flex-direction: column; gap: 4px; }
    .score-title { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .score-val { font-size: 42px; font-weight: 800; font-family: var(--font-mono); color: var(--color-vital); }
    .score-status { font-size: 12px; font-weight: 700; color: var(--text-title); display: flex; align-items: center; gap: 6px; }

    .ring-container {
      width: 90px;
      height: 90px;
      position: relative;
    }

    .ring-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .ring-bg { fill: none; stroke: var(--bg-pill); stroke-width: 8; }
    .ring-fill {
      fill: none;
      stroke: var(--color-vital);
      stroke-width: 8;
      stroke-dasharray: 226;
      stroke-dashoffset: 24;
      stroke-linecap: round;
    }

    /* Grid de Métricas Vitais */
    .vital-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .metric-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .metric-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
    }

    .metric-name { font-size: 12px; font-weight: 600; }
    .metric-num { font-size: 24px; font-weight: 800; font-family: var(--font-mono); color: var(--text-title); }
    .metric-unit { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-left: 2px; }

    /* Gráfico de ECG / VFC Sparkline SVG */
    .timeline-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .timeline-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sparkline-svg {
      width: 100%;
      height: 54px;
      overflow: visible;
    }

    /* Bottom TabBar */
    .bottom-tabbar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: calc(64px + var(--safe-bottom));
      background: var(--bg-tabbar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: var(--safe-bottom);
      z-index: 100;
    }

    .tab-btn {
      flex: 1;
      height: 48px;
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .tab-btn.active { color: var(--color-vital); }
    .tab-label { font-size: 11px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="app-viewport">

    <header class="app-header">
      <div>
        <div class="date-badge">Sábado, 03 Outubro</div>
        <h1 style="font-size: 20px; font-weight: 800; color: var(--text-title);">Status Biométrico</h1>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-circle" onclick="alternarTema()" title="Alternar Tema" aria-label="Tema">
          <svg class="svg-icon" id="icon-theme" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
          </svg>
        </button>
        <button type="button" class="btn-circle" title="Sincronizar Sensor" aria-label="Sincronizar">
          <svg class="svg-icon" viewBox="0 0 24 24">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="app-content">

      <!-- Recovery Ring Card -->
      <section class="recovery-card" aria-label="Recuperação Diária">
        <div class="score-info">
          <span class="score-title">Recuperação do Sistema</span>
          <div class="score-val">91%</div>
          <div class="score-status">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--color-vital);"></span>
            Pronto para Esforço Alto
          </div>
        </div>
        <div class="ring-container">
          <svg class="ring-svg" viewBox="0 0 80 80">
            <circle class="ring-bg" cx="40" cy="40" r="34"></circle>
            <circle class="ring-fill" cx="40" cy="40" r="34"></circle>
          </svg>
        </div>
      </section>

      <!-- Grade de Biomarcadores -->
      <section class="vital-grid" aria-label="Biomarcadores Vitais">
        <div class="metric-box">
          <div class="metric-head">
            <span class="metric-name">VFC (HRV)</span>
            <svg class="svg-icon" style="width: 16px; height: 16px; color: var(--color-accent);" viewBox="0 0 24 24">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
          </div>
          <div>
            <span class="metric-num">78</span><span class="metric-unit">ms</span>
          </div>
          <span style="font-size: 11px; color: var(--color-vital); font-weight: 600;">+12% acima da linha base</span>
        </div>

        <div class="metric-box">
          <div class="metric-head">
            <span class="metric-name">Freq. Repouso</span>
            <svg class="svg-icon" style="width: 16px; height: 16px; color: var(--color-stress);" viewBox="0 0 24 24">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </div>
          <div>
            <span class="metric-num">52</span><span class="metric-unit">bpm</span>
          </div>
          <span style="font-size: 11px; color: var(--color-vital); font-weight: 600;">Excelente eficiência</span>
        </div>

        <div class="metric-box">
          <div class="metric-head">
            <span class="metric-name">Sono Profundo</span>
            <svg class="svg-icon" style="width: 16px; height: 16px; color: var(--color-accent);" viewBox="0 0 24 24">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </div>
          <div>
            <span class="metric-num">2h 14m</span>
          </div>
          <span style="font-size: 11px; color: var(--text-muted); font-weight: 500;">28% do tempo total</span>
        </div>

        <div class="metric-box">
          <div class="metric-head">
            <span class="metric-name">Temperatura</span>
            <svg class="svg-icon" style="width: 16px; height: 16px; color: var(--color-warning);" viewBox="0 0 24 24">
              <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>
            </svg>
          </div>
          <div>
            <span class="metric-num">-0.2</span><span class="metric-unit">°C</span>
          </div>
          <span style="font-size: 11px; color: var(--color-vital); font-weight: 600;">Ótima estabilidade</span>
        </div>
      </section>

      <!-- Sparkline ECG Contínuo -->
      <section class="timeline-card" aria-label="Eletrocardiograma e Variabilidade">
        <div class="timeline-head">
          <span style="font-size: 13px; font-weight: 700; color: var(--text-title);">Traçado Contínuo de Estresse</span>
          <span style="font-size: 11px; color: var(--color-vital); font-weight: 600; font-family: var(--font-mono);">ZONA VERDE</span>
        </div>
        <svg class="sparkline-svg" viewBox="0 0 300 50">
          <path d="M0,25 Q30,10 60,30 T120,20 T150,5 T170,45 T190,15 T240,25 T300,20" fill="none" stroke="var(--color-vital)" stroke-width="2.5" stroke-linecap="round"></path>
        </svg>
      </section>

    </main>

    <!-- Bottom TabBar -->
    <nav class="bottom-tabbar" aria-label="Navegação Principal">
      <button type="button" class="tab-btn active">
        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span class="tab-label">Hoje</span>
      </button>
      <button type="button" class="tab-btn">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"></path></svg>
        <span class="tab-label">Tendências</span>
      </button>
      <button type="button" class="tab-btn">
        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span class="tab-label">Sensor</span>
      </button>
    </nav>

  </div>

  <script>
    function alternarTema() {
      const html = document.documentElement;
      const temaAtual = html.getAttribute('data-theme') || 'dark';
      const novoTema = temaAtual === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', novoTema);

      const meta = document.getElementById('meta-theme-color');
      if (meta) meta.setAttribute('content', novoTema === 'dark' ? '#090d16' : '#f0fdf4');

      const icon = document.getElementById('icon-theme');
      if (icon) {
        if (novoTema === 'light') {
          icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
        } else {
          icon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>';
        }
      }
    }
  </script>

</body>
</html>
