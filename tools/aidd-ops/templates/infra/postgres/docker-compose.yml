# =============================================================================
# AIDD-Ops — Bloco: PostgreSQL Centralizado (Cenário A)
# Camada 4: Banco Centralizado com Bancos Lógicos Isolados
# =============================================================================
# Imagem oficial: postgres (Docker Hub — mantida pelo PostgreSQL Global Dev Group)
# Validação: docker compose config (syntaxe) + G_INFRA_COMPOSE.py (Pacote 6)
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: aidd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Defina POSTGRES_ADMIN_PASSWORD no .env}
      POSTGRES_MULTIPLE_DATABASES: "${POSTGRES_MULTIPLE_DATABASES:?Defina os bancos no .env (ex: authentik_db,twenty_db,chatwoot_db,calcom_db)}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/01-init-multiple-databases.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - aidd_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MAX_RAM:-1g}

volumes:
  postgres_data:
    driver: local

networks:
  aidd_internal:
    driver: bridge
