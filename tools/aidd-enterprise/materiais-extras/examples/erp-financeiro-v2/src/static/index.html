<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Financeiro & Gestão Fiscal — AIDD v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --surface: rgba(17, 24, 39, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #10b981;
            --primary-hover: #059669;
            --danger: #ef4444;
            --text: #f9fafb;
            --muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% -20%, rgba(16, 185, 129, 0.25), transparent 60%);
            padding: 2rem 3.5rem;
        }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 2rem; }
        .brand { display: flex; align-items: center; gap: 0.8rem; font-size: 1.35rem; font-weight: 800; }
        .btn { padding: 0.65rem 1.3rem; border-radius: 10px; font-weight: 700; font-size: 0.88rem; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.05); color: #fff; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn:hover { background: rgba(255, 255, 255, 0.1); }
        .btn-primary { background: var(--primary); border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .metrics-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.3rem 1.5rem; backdrop-filter: blur(16px); }
        .metric-label { font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
        .metric-value { font-size: 1.7rem; font-weight: 800; margin-top: 0.4rem; }
        .controls { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
        .search-box input { padding: 0.75rem 1.2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: #fff; width: 350px; outline: none; }
        .search-box input:focus { border-color: var(--primary); }
        table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); backdrop-filter: blur(16px); }
        th, td { padding: 1.1rem 1.5rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-weight: 700; color: var(--muted); font-size: 0.82rem; text-transform: uppercase; }
        .btn-icon { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0.3rem; border-radius: 6px; }
        .btn-icon:hover { color: #fff; }
        .btn-icon.delete:hover { color: var(--danger); }
        .status-badge { padding: 0.3rem 0.7rem; border-radius: 9999px; font-size: 0.78rem; font-weight: 800; cursor: pointer; transition: all 0.2s; }
        .status-pago { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
        .status-pendente { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.4); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(16px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: #0b0f19; border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 500px; padding: 2rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--muted); margin-bottom: 0.4rem; }
        .form-input { width: 100%; padding: 0.75rem 1rem; background: #060911; border: 1px solid var(--border); border-radius: 10px; color: #fff; outline: none; }
        .form-input:focus { border-color: var(--primary); }
    
/* =========================================================================
   DESIGN SYSTEM UNIVERSAL (SCROLLBAR 4PX & BUTTON WRAP PROTECTION)
   ========================================================================= */
* {
    scrollbar-width: thin;
    scrollbar-color: rgba(59, 130, 246, 0.4) transparent;
}
::-webkit-scrollbar {
    width: 4px !important;
    height: 4px !important;
}
::-webkit-scrollbar-track {
    background: transparent !important;
}
::-webkit-scrollbar-thumb {
    background: rgba(59, 130, 246, 0.35) !important;
    border-radius: 9999px !important;
    transition: background 0.2s ease !important;
}
::-webkit-scrollbar-thumb:hover {
    background: rgba(59, 130, 246, 0.75) !important;
}

button, .btn, .btn-primary, .btn-secondary, .btn-gold, .btn-danger,
.tab-btn, .resp-status-btn, .lang-tab, .endpoint-link, .nav-item {
    white-space: nowrap !important;
    text-overflow: ellipsis;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex-shrink: 0 !important;
    line-height: 1.2 !important;
}

    </style>
</head>
<body>
    <header>
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            ERP Financeiro & Gestão Fiscal
        </div>
        <div style="display: flex; gap: 0.8rem;">
            <a href="/docs" target="_blank" class="btn">Swagger /docs</a>
            <button class="btn btn-primary" onclick="abrirModalNovo()">Novo Lançamento</button>
        </div>
    </header>

    <div class="metrics-bar">
        <div class="metric-card">
            <div class="metric-label">RECEITAS REALIZADAS</div>
            <div class="metric-value" id="val-rec-paga" style="color: #10b981;">R$ 0,00</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">DESPESAS PAGAS</div>
            <div class="metric-value" id="val-desp-paga" style="color: #ef4444;">R$ 0,00</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">SALDO LÍQUIDO REALIZADO</div>
            <div class="metric-value" id="val-saldo-real" style="color: #60a5fa;">R$ 0,00</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">SALDO PROJETADO TOTAL</div>
            <div class="metric-value" id="val-saldo-proj" style="color: #a855f7;">R$ 0,00</div>
        </div>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="busca" placeholder="Buscar por descrição, categoria ou cliente..." oninput="carregar()">
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <select id="filtro-tipo" class="form-input" style="width: auto;" onchange="carregar()">
                <option value="todos">Todos os Tipos</option>
                <option value="receita">Receitas</option>
                <option value="despesa">Despesas</option>
            </select>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>DESCRIÇÃO / ENTIDADE</th>
                <th>TIPO</th>
                <th>CATEGORIA</th>
                <th>VENCIMENTO</th>
                <th>VALOR</th>
                <th>STATUS (CLIQUE P/ ALTERNAR)</th>
                <th style="text-align: right;">AÇÕES</th>
            </tr>
        </thead>
        <tbody id="tabela-contas">
            <tr><td colspan="7" style="color: var(--muted);">Carregando lançamentos...</td></tr>
        </tbody>
    </table>

    <!-- MODAL FULL-CRUD -->
    <div class="modal-overlay" id="modal-conta">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 id="modal-title" style="font-size: 1.25rem; font-weight: 800;">Novo Lançamento</h3>
                <button onclick="fecharModal()" style="background: none; border: none; color: #fff; cursor: pointer; font-size: 1.5rem;">&times;</button>
            </div>
            <form onsubmit="salvarConta(event)">
                <input type="hidden" id="conta-id" value="">
                <div class="form-group">
                    <label class="form-label">DESCRIÇÃO</label>
                    <input type="text" class="form-input" id="conta-desc" required placeholder="Ex: Licença Software Anual">
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">TIPO</label>
                        <select class="form-input" id="conta-tipo">
                            <option value="receita">Receita</option>
                            <option value="despesa">Despesa</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">VALOR (R$)</label>
                        <input type="number" step="0.01" class="form-input" id="conta-valor" required placeholder="15000.00">
                    </div>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">CATEGORIA</label>
                        <input type="text" class="form-input" id="conta-cat" required placeholder="Consultoria / Infra">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">VENCIMENTO</label>
                        <input type="date" class="form-input" id="conta-venc" required value="2026-09-15">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">CLIENTE / FORNECEDOR</label>
                    <input type="text" class="form-input" id="conta-ent" placeholder="Empresa Parceira S.A.">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 1.5rem;">
                    <button type="button" class="btn" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Lançamento</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function carregar() {
            const busca = document.getElementById('busca').value;
            const tipo = document.getElementById('filtro-tipo').value;
            const [resumo, contas] = await Promise.all([
                fetch('/api/fluxo-caixa').then(r => r.json()),
                fetch('/api/contas?tipo=' + tipo + '&busca=' + encodeURIComponent(busca)).then(r => r.json())
            ]);

            document.getElementById('val-rec-paga').innerText = 'R$ ' + resumo.receitas_recebidas.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            document.getElementById('val-desp-paga').innerText = 'R$ ' + resumo.despesas_pagas.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            document.getElementById('val-saldo-real').innerText = 'R$ ' + resumo.saldo_realizado.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            document.getElementById('val-saldo-proj').innerText = 'R$ ' + resumo.saldo_projetado.toLocaleString('pt-BR', {minimumFractionDigits: 2});

            document.getElementById('tabela-contas').innerHTML = contas.map(c => `
                <tr>
                    <td>
                        <div style="font-weight: 700;">${c.descricao}</div>
                        <div style="color: var(--muted); font-size: 0.8rem;">${c.entidade_nome || 'Geral'}</div>
                    </td>
                    <td><span style="font-weight: 800; font-size: 0.85rem; color: ${c.tipo === 'receita' ? '#10b981' : '#ef4444'}">${c.tipo.toUpperCase()}</span></td>
                    <td>${c.categoria}</td>
                    <td>${c.data_vencimento}</td>
                    <td style="font-weight: 800;">R$ ${c.valor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                    <td>
                        <span class="status-badge status-${c.status}" onclick="alternarStatus(${c.id})" title="Clique para mudar status">
                            ${c.status.toUpperCase()}
                        </span>
                    </td>
                    <td style="text-align: right;">
                        <button class="btn-icon" title="Editar" onclick="editarConta(${c.id})">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        </button>
                        <button class="btn-icon delete" title="Excluir" onclick="excluirConta(${c.id}, '${c.descricao}')">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        async function alternarStatus(id) {
            await fetch('/api/contas/alternar-status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id })
            });
            carregar();
        }

        function abrirModalNovo() {
            document.getElementById('modal-title').innerText = 'Novo Lançamento';
            document.getElementById('conta-id').value = '';
            document.getElementById('conta-desc').value = '';
            document.getElementById('conta-valor').value = '';
            document.getElementById('conta-cat').value = '';
            document.getElementById('modal-conta').style.display = 'flex';
        }

        async function editarConta(id) {
            const c = await fetch('/api/contas/detalhes?id=' + id).then(r => r.json());
            document.getElementById('modal-title').innerText = 'Editar Lançamento #' + id;
            document.getElementById('conta-id').value = c.id;
            document.getElementById('conta-desc').value = c.descricao;
            document.getElementById('conta-tipo').value = c.tipo;
            document.getElementById('conta-valor').value = c.valor;
            document.getElementById('conta-cat').value = c.categoria;
            document.getElementById('conta-venc').value = c.data_vencimento;
            document.getElementById('conta-ent').value = c.entidade_nome || '';
            document.getElementById('modal-conta').style.display = 'flex';
        }

        async function salvarConta(e) {
            e.preventDefault();
            await fetch('/api/contas/salvar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    id: document.getElementById('conta-id').value || null,
                    descricao: document.getElementById('conta-desc').value,
                    tipo: document.getElementById('conta-tipo').value,
                    valor: document.getElementById('conta-valor').value,
                    categoria: document.getElementById('conta-cat').value,
                    data_vencimento: document.getElementById('conta-venc').value,
                    entidade_nome: document.getElementById('conta-ent').value
                })
            });
            fecharModal();
            carregar();
        }

        async function excluirConta(id, desc) {
            if (confirm('Excluir lançamento "' + desc + '"?')) {
                await fetch('/api/contas/deletar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id })
                });
                carregar();
            }
        }

        function fecharModal() { document.getElementById('modal-conta').style.display = 'none'; }
        window.onload = carregar;
    </script>
</body>
</html>
