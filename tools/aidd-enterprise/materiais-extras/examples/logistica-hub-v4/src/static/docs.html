    <style>

        header { height: 56px; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; }

        .btn-primary { background: var(--primary); border-color: var(--primary); }

        @media (max-width: 1100px) { .layout-container { grid-template-columns: 260px 1fr; } aside.toc { display: none; } }
        @media (max-width: 768px) { .layout-container { grid-template-columns: 1fr; } aside.sidebar { display: none; } }

        .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.12); color: var(--primary-light); }

        main.content { padding: 3.5rem 4rem; max-width: 900px; margin: 0 auto; width: 100%; }

        .doc-title { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.8rem; color: #fff; }

        li { margin-bottom: 0.4rem; }

        .doc-table { width: 100%; border-collapse: collapse; margin: 1.5rem 0 2rem 0; font-size: 0.88rem; }
        .doc-table th, .doc-table td { padding: 0.85rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        .doc-table th { background: rgba(255, 255, 255, 0.02); font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .doc-table td code { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--primary-light); background: rgba(59, 130, 246, 0.1); padding: 0.15rem 0.35rem; border-radius: 4px; }

        .callout.tip { background: rgba(16, 185, 129, 0.08); border-color: rgba(16, 185, 129, 0.3); }

        .search-container { background: #080c18; border: 1px solid var(--border-hover); border-radius: 16px; width: 100%; max-width: 600px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9); overflow: hidden; }
        .search-input-header { display: flex; align-items: center; gap: 0.8rem; padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); }
        .search-input-header input { background: none; border: none; color: #fff; font-size: 1.1rem; width: 100%; outline: none; }
        .search-results-list { max-height: 380px; overflow-y: auto; padding: 0.8rem; }
        .search-item { padding: 0.8rem 1rem; border-radius: 8px; cursor: pointer; }
        .search-item:hover { background: rgba(59, 130, 246, 0.15); }
        .search-item-title { font-weight: 700; font-size: 0.95rem; color: #fff; }
        .search-item-sub { font-size: 0.8rem; color: var(--text-muted); }

        aside.toc { position: sticky; top: 56px; height: calc(100vh - 56px); padding: 2rem 1.5rem; font-size: 0.82rem; }
        .toc-title { font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 1rem; font-size: 0.72rem; letter-spacing: 0.05em; }
        .toc-link { display: block; color: var(--text-muted); text-decoration: none; margin-bottom: 0.6rem; transition: color 0.15s; }

                        <tbody>

        let currentPageIndex = 0;

        function montarSidebar() {
            const nav = document.getElementById('sidebar-nav-list');
            let html = '';
            let currentCat = '';

            docPages.forEach((page, idx) => {
                if (page.cat !== currentCat) {
                    currentCat = page.cat;
                    html += '<li class="nav-cat">' + currentCat + '</li>';
                }
                const activeClass = idx === 0 ? 'active' : '';
                html += '<li><a class="nav-item ' + activeClass + '" onclick="carregarPagina(' + idx + ')" id="nav-item-' + idx + '">' + page.title + '</a></li>';
            });
            nav.innerHTML = html;
        }

        function carregarPagina(index) {
            if (index < 0 || index >= docPages.length) return;
            currentPageIndex = index;
            const p = docPages[index];

            document.querySelectorAll('.nav-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            document.getElementById('breadcrumb-box').innerText = 'Docs > ' + p.cat + ' > ' + p.title;
            document.getElementById('page-title').innerText = p.title;
            document.getElementById('page-subtitle').innerText = p.subtitle;
            document.getElementById('page-content-area').innerHTML = p.content;

            const h2Elements = document.getElementById('page-content-area').querySelectorAll('h2');
            const tocArea = document.getElementById('toc-links-area');
            let tocHtml = '';
            h2Elements.forEach((h2, i) => {
                const anchorId = 'section-' + i;
                h2.id = anchorId;
                tocHtml += '<a href="#' + anchorId + '" class="toc-link">' + h2.innerText + '</a>';
            });
            tocArea.innerHTML = tocHtml || '<span style="color: var(--text-muted);">Topico unico</span>';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function abrirBusca() {
            document.getElementById('search-modal').style.display = 'flex';
            document.getElementById('modal-search-input').focus();
            filtrarResultadosBusca('');
        }

        function fecharBusca() {
            document.getElementById('search-modal').style.display = 'none';
        }

        function filtrarResultadosBusca(query) {
            const q = query.toLowerCase();
            const box = document.getElementById('search-results-box');
            const results = docPages.filter(p => !q || p.title.toLowerCase().includes(q) || p.subtitle.toLowerCase().includes(q) || p.content.toLowerCase().includes(q));

            box.innerHTML = results.map(p => {
                const idx = docPages.indexOf(p);
                return '<div class="search-item" onclick="carregarPagina(' + idx + '); fecharBusca();">' +
                       '<div class="search-item-title">' + p.title + '</div>' +
                       '<div class="search-item-sub">' + p.cat + ' • ' + p.subtitle + '</div>' +
                       '</div>';
            }).join('');
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                abrirBusca();
            }
            if (e.key === 'Escape') fecharBusca();
        });

        window.onload = () => {
            montarSidebar();
            carregarPagina(0);
        };
    </script>
</body>
</html>
