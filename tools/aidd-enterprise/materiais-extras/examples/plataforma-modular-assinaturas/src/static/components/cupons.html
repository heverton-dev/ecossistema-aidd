<div class="card module-card" id="module-cupons">
    <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3 style="font-size: 1.2rem; font-weight: 700; color: #f8fafc;">Cupons</h3>
        <span class="card-tag" style="position: static;">Modulo Ativo</span>
    </div>
    <div class="card-body" id="cupons-items-container">
        <p style="color: var(--text-muted); font-size: 0.9rem;">Carregando dados do modulo cupons...</p>
    </div>
    <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
        <input type="text" id="input-cupons-novo" placeholder="Novo cupons..." style="flex: 1; padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid var(--border-subtle); background: #060911; color: #fff;">
        <button class="btn btn-gold" onclick="adicionarItemCupons()">Adicionar</button>
    </div>
</div>
