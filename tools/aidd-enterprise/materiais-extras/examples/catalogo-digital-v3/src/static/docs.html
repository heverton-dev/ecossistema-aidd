<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital WhatsApp Docs — Central Oficial AIDD v3.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --sidebar-bg: #05070d;
            --surface: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --text-main: #f9fafb;
            --text-muted: #94a3b8;
            --code-bg: #050811;
            --callout-bg: rgba(59, 130, 246, 0.08);
            --callout-border: rgba(59, 130, 246, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            height: 56px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }
        .brand-group { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; }
        .brand-badge {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: var(--primary-light);
            font-size: 0.72rem;
            font-weight: 800;
            padding: 0.2rem 0.5rem;
            border-radius: 9999px;
        }
        .nav-actions { display: flex; align-items: center; gap: 0.8rem; }
        .btn {
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--border-hover); }
        .btn-primary { background: var(--primary); border-color: var(--primary); }

        .layout-container {
            display: grid;
            grid-template-columns: 280px 1fr 240px;
            margin-top: 56px;
            min-height: calc(100vh - 56px);
        }

        aside.sidebar {
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            position: sticky;
            top: 56px;
            height: calc(100vh - 56px);
            overflow-y: auto;
            padding: 1.2rem 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .search-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            padding: 0.55rem 0.8rem;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.82rem;
            cursor: pointer;
        }
        .search-trigger kbd {
            background: rgba(255, 255, 255, 0.08);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
        }
        .sidebar-nav { list-style: none; }
        .nav-cat { font-size: 0.72rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 0.8rem 0.6rem 0.3rem 0.6rem; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.7rem;
            border-radius: 8px;
            color: #cbd5e1;
            font-size: 0.86rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary-light);
        }

        main.content {
            padding: 3.5rem 4rem;
            max-width: 860px;
            margin: 0 auto;
            width: 100%;
        }
        .breadcrumb {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .doc-title { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.8rem; }
        .doc-subtitle { font-size: 1.15rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        
        h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 2rem; margin-bottom: 1rem; color: #fff; }
        p { font-size: 0.98rem; line-height: 1.7; color: #cbd5e1; margin-bottom: 1.2rem; }
        ul { padding-left: 1.4rem; margin-bottom: 1.2rem; color: #cbd5e1; line-height: 1.7; }
        li { margin-bottom: 0.4rem; }

        .callout {
            background: var(--callout-bg);
            border: 1px solid var(--callout-border);
            border-radius: 12px;
            padding: 1.2rem 1.4rem;
            margin: 1.5rem 0;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            font-size: 0.92rem;
            line-height: 1.6;
        }
        .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.2rem; margin: 1.5rem 0; }
        .feature-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.3rem; }
        .feature-card h4 { font-size: 1rem; font-weight: 700; margin-bottom: 0.4rem; color: #fff; }
        .feature-card p { font-size: 0.88rem; color: var(--text-muted); margin: 0; line-height: 1.5; }
        .feature-icon { margin-bottom: 0.8rem; }

        .code-box {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin: 1.5rem 0;
        }
        .code-tab-header {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border);
            padding: 0.6rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .code-tab-title { font-size: 0.78rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--text-muted); }
        .btn-copy {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-copy:hover { background: var(--primary); }
        pre { padding: 1.2rem; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 0.86rem; line-height: 1.6; color: #e2e8f0; }

        .ascii-diagram { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; line-height: 1.3; overflow-x: auto; color: var(--primary-light); }
        .doc-table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; background: var(--surface); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
        .doc-table th, .doc-table td {{ padding: 0.9rem 1.2rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.88rem; }}
        .doc-table th {{ font-weight: 700; color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; }}

        .badges-box { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
        .badge-tag { background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.3); color: var(--primary-light); padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.78rem; font-family: 'JetBrains Mono', monospace; font-weight: 700; }

        .doc-nav-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            gap: 1.5rem;
        }
        .nav-card {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .nav-card-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .nav-card-title { font-size: 1rem; font-weight: 800; color: #fff; margin-top: 0.3rem; }

        .modal-search {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding-top: 12vh;
            z-index: 100;
        }
        .search-container {
            background: #080c18;
            border: 1px solid var(--border-hover);
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }
        .search-input-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .search-input-header input {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            width: 100%;
            outline: none;
        }
        .search-results-list {
            max-height: 380px;
            overflow-y: auto;
            padding: 0.8rem;
        }
        .search-item {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        .search-item:hover { background: rgba(59, 130, 246, 0.15); }
        .search-item-title { font-weight: 700; font-size: 0.95rem; color: #fff; }
        .search-item-sub { font-size: 0.8rem; color: var(--text-muted); }

        aside.toc {
            position: sticky;
            top: 56px;
            height: calc(100vh - 56px);
            padding: 2rem 1.5rem;
            font-size: 0.82rem;
        }
        .toc-title { font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 1rem; font-size: 0.72rem; letter-spacing: 0.05em; }
        .toc-link { display: block; color: var(--text-muted); text-decoration: none; margin-bottom: 0.6rem; transition: color 0.15s; }
        .toc-link:hover { color: var(--primary-light); }
    
/* =========================================================================
   DESIGN SYSTEM UNIVERSAL (SCROLLBAR 4PX & BUTTON WRAP PROTECTION)
   ========================================================================= */
* {
    scrollbar-width: thin;

}

}

}

    background: rgba(59, 130, 246, 0.75) !important;

button, .btn, .btn-primary, .btn-secondary, .btn-gold, .btn-danger,
.tab-btn, .resp-status-btn, .lang-tab, .endpoint-link, .nav-item {

    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex-shrink: 0 !important;
    line-height: 1.2 !important;
}

    </style>

    <script>
        const docPages = [{"id": "intro", "cat": "Comece Aqui", "title": "O que é o Catálogo Digital WhatsApp?", "subtitle": "Visão geral de 60 segundos: propósito corporativo, diferenciais e arquitetura.", "content": "\n                <div class=\"callout tip\">\n                    <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#10b981\" stroke-width=\"2\"><path d=\"M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6\"/></svg>\n                    <div>\n                        <strong>AIDD v3.0 Enterprise Standard:</strong> Este projeto foi 100% gerado seguindo as 3 Regras de Ouro da Engenharia Agêntica, entregando Full-CRUD, Webhooks para n8n e Swagger OpenAPI.\n                    </div>\n                </div>\n\n                <h2>Propósito do Sistema</h2>\n                <p>O <strong>Catálogo Digital WhatsApp</strong> é uma solução de software de alta performance construída para operação corporativa real. Desenvolvido com uma arquitetura desacoplada de <em>Vertical Slices</em>, cada funcionalidade funciona de maneira independente, permitindo escalabilidade horizontal e manutenção com zero regressões.</p>\n\n                <h2>Principais Capacidades</h2>\n                <div class=\"feature-grid\">\n                    <div class=\"feature-card\">\n                        <div class=\"feature-icon\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2\"><path d=\"M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5\"/></svg></div>\n                        <h4>Vertical Slices Full-Stack</h4>\n                        <p>Cada módulo possui seu próprio backend SQLite/Postgres, serviços isolados e componentes de UI.</p>\n                    </div>\n                    <div class=\"feature-card\">\n                        <div class=\"feature-icon\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#10b981\" stroke-width=\"2\"><polyline points=\"20 6 9 17 4 12\"/></svg></div>\n                        <h4>Full-CRUD & 1-Click Actions</h4>\n                        <p>Criar, buscar em tempo real, editar em modal e excluir com proteção de integridade.</p>\n                    </div>\n                    <div class=\"feature-card\">\n                        <div class=\"feature-icon\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#a855f7\" stroke-width=\"2\"><circle cx=\"18\" cy=\"5\" r=\"3\"/><circle cx=\"6\" cy=\"12\" r=\"3\"/><circle cx=\"18\" cy=\"19\" r=\"3\"/><line x1=\"8.59\" y1=\"13.51\" x2=\"15.42\" y2=\"17.49\"/><line x1=\"15.41\" y1=\"6.51\" x2=\"8.59\" y2=\"10.49\"/></svg></div>\n                        <h4>Webhooks Nativos para n8n</h4>\n                        <p>Disparo automático de HTTP POST assíncrono em background para fluxos de automação.</p>\n                    </div>\n                </div>\n            "}, {"id": "quickstart", "cat": "Comece Aqui", "title": "Instalação & Guia Rápido", "subtitle": "Como clonar, rodar localmente e executar testes mecânicos em menos de 5 segundos.", "content": "\n                <h2>Pré-requisitos</h2>\n                <ul>\n                    <li>Python 3.10+ (Recomendado 3.14)</li>\n                    <li>Navegador moderno com suporte a HTML5</li>\n                </ul>\n\n                <h2>Executando Localmente</h2>\n                <p>O projeto roda sem dependências externas pesadas, utilizando o motor de banco de dados SQLite WAL mode nativo:</p>\n\n                <div class=\"code-box\">\n                    <div class=\"code-tab-header\">\n                        <div class=\"code-tab-title\">Terminal / Shell</div>\n                        <button class=\"btn-copy\" onclick=\"copiarCodigo(this)\">Copiar</button>\n                    </div>\n                    <pre><code># 1. Navegue até a pasta do projeto\ncd C:\\Users\\trcnologia\\Desktop\\catalogo-digital-v3\n\n# 2. Inicie o servidor\npython src/server.py\n\n# 3. Acesse a aplicação no navegador\n# Web App:     http://localhost:3000\n# Swagger API: http://localhost:3000/docs\n# Docs Portal: http://localhost:3000/docs/guia</code></pre>\n                </div>\n\n                <h2>Rodando a Bateria de Testes Unitários</h2>\n                <div class=\"code-box\">\n                    <div class=\"code-tab-header\">\n                        <div class=\"code-tab-title\">pytest</div>\n                        <button class=\"btn-copy\" onclick=\"copiarCodigo(this)\">Copiar</button>\n                    </div>\n                    <pre><code>pytest -v tests/unit/</code></pre>\n                </div>\n            "}, {"id": "architecture", "cat": "Arquitetura & Engenharia", "title": "Clean Architecture & Vertical Slices", "subtitle": "Entenda a segregação por fatias verticais e a soberania do Shared Kernel.", "content": "\n                <h2>O Conceito de Vertical Slice no AIDD v3.0</h2>\n                <p>Ao invés da arquitetura tradicional em 3 camadas onde uma alteração simples exige modificar 6 pastas distantes, a arquitetura Vertical Slice agrupa tudo o que pertence a uma funcionalidade de negócio dentro da mesma pasta.</p>\n\n                <div class=\"diagram-box\">\n                    <pre class=\"ascii-diagram\">\n┌─────────────────────────────────────────────────────────────┐\n│                       HTTP / REST API                       │\n└──────────────────────────────┬──────────────────────────────┘\n                               │\n            ┌──────────────────┼──────────────────┐\n            ▼                  ▼                  ▼\n  ┌──────────────────┐┌──────────────────┐┌──────────────────┐\n  │ MÓDULO 1         ││ MÓDULO 2         ││ MÓDULO 3         │\n  │ • Models SQLite  ││ • Models SQLite  ││ • Models SQLite  │\n  │ • Services       ││ • Services       ││ • Services       │\n  │ • Routes REST    ││ • Routes REST    ││ • Routes REST    │\n  └─────────┬────────┘└─────────┬────────┘└─────────┬────────┘\n            │                   │                   │\n  ┌─────────▼───────────────────▼───────────────────▼────────┐\n  │ SHARED KERNEL & EVENTBUS                                 │\n  │ • Crypto PBKDF2  • Formatters BRL  • Webhooks Dispatcher │\n  └──────────────────────────────────────────────────────────┘\n                    </pre>\n                </div>\n\n                <h2>Estrutura de Arquivos</h2>\n                <div class=\"code-box\">\n                    <pre><code>src/\n├── core/\n│   ├── database.py       # Dual-Database Engine (SQLite WAL & PostgreSQL)\n│   ├── events.py         # EventBus desacoplado Pub/Sub\n│   ├── openapi.py        # Gerador automático Swagger OpenAPI 3.0\n│   └── webhooks.py       # Threaded Webhook Dispatcher para n8n\n├── shared/\n│   ├── utils/crypto.py   # Hashing seguro com Salt criptográfico\n│   ├── utils/formatters.py # Formatação de moedas BRL e sanitização WhatsApp\n│   └── ui/icons.py       # Catálogo de ícones vetoriais SVG Lucide inline\n└── modules/              # Fatias Verticais de Negócio</code></pre>\n                </div>\n            "}, {"id": "agentic", "cat": "Arquitetura & Engenharia", "title": "Engenharia Agêntica & Racional de Tokens", "subtitle": "Como evitar o estouro de tokens e acelerar a produtividade em 90%.", "content": "\n                <h2>As 3 Regras de Ouro Anti-Estouro de Contexto</h2>\n                <div class=\"rules-table-container\">\n                    <table class=\"doc-table\">\n                        <thead>\n                            <tr>\n                                <th>Regra de Ouro</th>\n                                <th>Por Que Evita Estourar o Limite</th>\n                                <th>Impacto Medido</th>\n                            </tr>\n                        </thead>\n                        <tbody>\n                            <tr>\n                                <td><strong>1. Não usar o chat principal como terminal</strong></td>\n                                <td>Deixe compilação, testes e validações mecânicas rodando via Python local determinístico.</td>\n                                <td><strong>99.3% de economia</strong> de tokens semanais.</td>\n                            </tr>\n                            <tr>\n                                <td><strong>2. Worktrees do ORCA para frentes grandes</strong></td>\n                                <td>Cada tarefa separada em sua mesa limpa evita acúmulo de contexto residual.</td>\n                                <td>Zero contaminação cruzada de arquivos.</td>\n                            </tr>\n                            <tr>\n                                <td><strong>3. Reinicie sessões usando o Plano JSON</strong></td>\n                                <td>Ao retomar, aponte para o <code>PLANO-EXECUCAO-ESTRUTURADO.json</code>. O agente lê o estado exato em 500 tokens.</td>\n                                <td>Economia de <strong>80.000 tokens</strong> por início de sessão.</td>\n                            </tr>\n                        </tbody>\n                    </table>\n                </div>\n            "}, {"id": "mod-produtos", "cat": "Módulos Verticais", "title": "Módulo: Produtos & Estoque", "subtitle": "Gestão de catálogo com imagens, categorias, controle de disponibilidade e preços promocionais.", "content": "\n                <h2>Visão do Módulo</h2>\n                <p>Gestão de catálogo com imagens, categorias, controle de disponibilidade e preços promocionais.</p>\n\n                <div class=\"feature-grid\">\n                    <div class=\"feature-card\">\n                        <h4>Camada de Dados</h4>\n                        <p>Tabela dedicada indexada com persistência SQLite WAL e migrações seguras.</p>\n                    </div>\n                    <div class=\"feature-card\">\n                        <h4>Regras de Negócio</h4>\n                        <p>Serviços desacoplados disparando eventos rastreáveis para o EventBus.</p>\n                    </div>\n                </div>\n\n                <h2>Eventos Emitidos para Webhook</h2>\n                <div class=\"badges-box\">\n                    <span class=\"badge-tag\">produto.criado</span><span class=\"badge-tag\">produto.atualizado</span><span class=\"badge-tag\">produto.excluido</span>\n                </div>\n\n                <h2>Exemplo de Integração REST</h2>\n                <div class=\"code-box\">\n                    <div class=\"code-tab-header\">\n                        <div class=\"code-tab-title\">cURL / HTTP POST</div>\n                        <button class=\"btn-copy\" onclick=\"copiarCodigo(this)\">Copiar</button>\n                    </div>\n                    <pre><code>curl -X POST http://localhost:3000/api/produtos \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"nome\": \"Combo Especial\",\n  \"preco\": 89.9,\n  \"categoria\": \"Lanches\"\n}'</code></pre>\n                </div>\n            "}, {"id": "mod-pedidos_whatsapp", "cat": "Módulos Verticais", "title": "Módulo: Pedidos & WhatsApp", "subtitle": "Carrinho de compras inteligente com cálculo de frete e checkout direto para a API do WhatsApp.", "content": "\n                <h2>Visão do Módulo</h2>\n                <p>Carrinho de compras inteligente com cálculo de frete e checkout direto para a API do WhatsApp.</p>\n\n                <div class=\"feature-grid\">\n                    <div class=\"feature-card\">\n                        <h4>Camada de Dados</h4>\n                        <p>Tabela dedicada indexada com persistência SQLite WAL e migrações seguras.</p>\n                    </div>\n                    <div class=\"feature-card\">\n                        <h4>Regras de Negócio</h4>\n                        <p>Serviços desacoplados disparando eventos rastreáveis para o EventBus.</p>\n                    </div>\n                </div>\n\n                <h2>Eventos Emitidos para Webhook</h2>\n                <div class=\"badges-box\">\n                    <span class=\"badge-tag\">pedido.gerado</span><span class=\"badge-tag\">pedido.whatsapp_enviado</span>\n                </div>\n\n                <h2>Exemplo de Integração REST</h2>\n                <div class=\"code-box\">\n                    <div class=\"code-tab-header\">\n                        <div class=\"code-tab-title\">cURL / HTTP POST</div>\n                        <button class=\"btn-copy\" onclick=\"copiarCodigo(this)\">Copiar</button>\n                    </div>\n                    <pre><code>curl -X POST http://localhost:3000/api/pedidos \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"cliente\": \"Heverton\",\n  \"telefone\": \"11999998888\",\n  \"total\": 120.0\n}'</code></pre>\n                </div>\n            "}, {"id": "webhooks", "cat": "Automações & DevOps", "title": "Webhooks & Integração com n8n / Zapier", "subtitle": "Disparo assíncrono de notificações de eventos para orquestradores de automação.", "content": "\n            <h2>Como Funciona o Webhook Dispatcher</h2>\n            <p>Quando uma ação ocorre no sistema, o <code>WebhookDispatcher</code> dispara uma requisição HTTP POST assíncrona em background para a URL configurada sem bloquear o tempo de resposta da interface.</p>\n\n            <h2>Configurando a URL de Webhook</h2>\n            <div class=\"code-box\">\n                <div class=\"code-tab-header\">\n                    <div class=\"code-tab-title\">cURL / Salvar Webhook</div>\n                    <button class=\"btn-copy\" onclick=\"copiarCodigo(this)\">Copiar</button>\n                </div>\n                <pre><code>curl -X POST http://localhost:3000/api/admin/salvar-webhook \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"webhook_url\": \"https://seu-n8n.webhook.site/webhook/crm-events\"}'</code></pre>\n            </div>\n\n            <h2>Eventos Suportados neste Projeto</h2>\n            <div class=\"badges-box\">\n                <span class=\"badge-tag\">pedido.gerado</span><span class=\"badge-tag\">produto.criado</span>\n            </div>\n        "}, {"id": "deploy", "cat": "Automações & DevOps", "title": "Deploy em Produção (Docker & VPS Hetzner)", "subtitle": "Guia de conteinerização multi-stage e provisionamento em servidor cloud.", "content": "\n            <h2>Deploy com Docker & Docker Compose</h2>\n            <div class=\"code-box\">\n                <div class=\"code-tab-header\">\n                    <div class=\"code-tab-title\">Terminal / Bash</div>\n                    <button class=\"btn-copy\" onclick=\"copiarCodigo(this)\">Copiar</button>\n                </div>\n                <pre><code># Subir container em modo detached\ndocker compose up -d --build\n\n# Verificar logs\ndocker compose logs -f</code></pre>\n            </div>\n\n            <h2>Deploy Direto em VPS Linux (Ubuntu / Debian)</h2>\n            <div class=\"code-box\">\n                <div class=\"code-tab-header\">\n                    <div class=\"code-tab-title\">deploy.sh</div>\n                    <button class=\"btn-copy\" onclick=\"copiarCodigo(this)\">Copiar</button>\n                </div>\n                <pre><code>chmod +x deploy.sh\n./deploy.sh</code></pre>\n            </div>\n        "}];
        let currentPageIndex = 0;

        function montarSidebar() {
            const nav = document.getElementById('sidebar-nav-list');
            let html = '';
            let currentCat = '';

            docPages.forEach((page, idx) => {
                if (page.cat !== currentCat) {
                    currentCat = page.cat;
                    html += '<li class="nav-cat">' + currentCat + '</li>';
                }
                const activeClass = idx === 0 ? 'active' : '';
                html += '<li><a class="nav-item ' + activeClass + '" onclick="carregarPagina(' + idx + ')" id="nav-item-' + idx + '">' + page.title + '</a></li>';
            });
            nav.innerHTML = html;
        }

        function carregarPagina(index) {
            if (index < 0 || index >= docPages.length) return;
            currentPageIndex = index;
            const p = docPages[index];

            document.querySelectorAll('.nav-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            document.getElementById('breadcrumb-box').innerText = 'Docs > ' + p.cat + ' > ' + p.title;
            document.getElementById('page-title').innerText = p.title;
            document.getElementById('page-subtitle').innerText = p.subtitle;
            document.getElementById('page-content-area').innerHTML = p.content;

            const prevCard = document.getElementById('prev-card');
            const nextCard = document.getElementById('next-card');

            if (index > 0) {
                prevCard.style.visibility = 'visible';
                document.getElementById('prev-title').innerText = docPages[index - 1].title;
            } else {
                prevCard.style.visibility = 'hidden';
            }

            if (index < docPages.length - 1) {
                nextCard.style.visibility = 'visible';
                document.getElementById('next-title').innerText = docPages[index + 1].title;
            } else {
                nextCard.style.visibility = 'hidden';
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function irParaPaginaRelativa(delta) {
            carregarPagina(currentPageIndex + delta);
        }

        function copiarCodigo(btn) {
            const code = btn.closest('.code-box').querySelector('pre code').innerText;
            navigator.clipboard.writeText(code);
            btn.innerText = 'Copiado!';
            setTimeout(() => { btn.innerText = 'Copiar'; }, 2000);
        }

        function abrirBusca() {
            document.getElementById('search-modal').style.display = 'flex';
            document.getElementById('modal-search-input').focus();
            filtrarResultadosBusca('');
        }

        function fecharBusca(e) {
            document.getElementById('search-modal').style.display = 'none';
        }

        function filtrarResultadosBusca(query) {
            const q = query.toLowerCase();
            const box = document.getElementById('search-results-box');
            const results = docPages.filter(p => !q || p.title.toLowerCase().includes(q) || p.subtitle.toLowerCase().includes(q) || p.content.toLowerCase().includes(q));

            box.innerHTML = results.map(p => {
                const idx = docPages.indexOf(p);
                return '<div class="search-item" onclick="carregarPagina(' + idx + '); fecharBusca();">' +
                       '<div class="search-item-title">' + p.title + '</div>' +
                       '<div class="search-item-sub">' + p.cat + ' • ' + p.subtitle + '</div>' +
                       '</div>';
            }).join('');
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                abrirBusca();
            }
            if (e.key === 'Escape') {
                fecharBusca();
            }
        });

        window.onload = () => {
            montarSidebar();
            carregarPagina(0);
        };
    </script>
</body>
</html>
