# Alembic Configuration — AIDD Master Enterprise
# This file is generated by scaffold_alembic.py

[alembic]
script_location = alembic
prepend_sys_path = .

# SQLite URL — the actual database path is resolved at runtime by alembic/env.py
# from DATABASE_URL env var or defaults to sqlite:///app.db
sqlalchemy.url = sqlite:///app.db

# Template used when generating new revisions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
