; =============================================================================
; AIDD-Ops — Configuracao Ansible (NIH #15: hardening via devsec.hardening)
; =============================================================================
; Control node precisa de um Python POSIX com ansible-core instalado (Linux/WSL/
; container de CI). ansible-core nao suporta Windows nativo como control node —
; por isso o SSHRunner (src/core/ssh_runner.py) detecta ausencia do binario
; 'ansible-playbook' via shutil.which e falha explicitamente em vez de simular.
; =============================================================================
[defaults]
inventory = ./inventory
collections_path = ./collections
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
timeout = 30
interpreter_python = auto_silent

[paramiko_connection]
record_host_keys = False
