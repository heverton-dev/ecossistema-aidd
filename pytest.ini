[pytest]
minversion = 7.0
testpaths = modulos/01-governanca-e-qualidade/gates modulos/02-triade-motores/fluxo-01-pure/gates modulos/02-triade-motores/fluxo-02-open/gates modulos/02-triade-motores/fluxo-03-freedom/gates modulos/03-plataforma-e-entrega/gates modulos/04-nucleo-compartilhado/gates scripts
python_files = test_*.py G_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
