<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$title$ — Ecossistema AIDD</title>
  
  <!-- Tipografia de Elite -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* Design Tokens & Theme Variables */
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      
      /* Light Theme */
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #ffffff;
      --bg-sidebar: #f1f5f9;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      
      --brand-primary: #2563eb;
      --brand-accent: #0284c7;
      --brand-badge-bg: rgba(37, 99, 235, 0.08);
      --brand-badge-text: #1d4ed8;
      
      --code-bg: #0f172a;
      --code-text: #f8fafc;
      --code-inline-bg: #e2e8f0;
      --code-inline-text: #0f172a;
      
      --table-header-bg: #f8fafc;
      --table-row-zebra: rgba(241, 245, 249, 0.6);
      --table-row-hover: #f1f5f9;
      
      --callout-bg: #f0f9ff;
      --callout-border: #0284c7;
      --callout-text: #0369a1;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    }

    [data-theme="dark"] {
      --bg-base: #090d16;
      --bg-surface: #0f172a;
      --bg-surface-elevated: #1e293b;
      --bg-sidebar: #0d1322;
      --border-subtle: #1e293b;
      --border-strong: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      
      --brand-primary: #38bdf8;
      --brand-accent: #60a5fa;
      --brand-badge-bg: rgba(56, 189, 248, 0.12);
      --brand-badge-text: #38bdf8;
      
      --code-bg: #030712;
      --code-text: #e2e8f0;
      --code-inline-bg: #1e293b;
      --code-inline-text: #38bdf8;
      
      --table-header-bg: #1e293b;
      --table-row-zebra: rgba(30, 41, 59, 0.4);
      --table-row-hover: #1e293b;
      
      --callout-bg: rgba(14, 165, 233, 0.08);
      --callout-border: #38bdf8;
      --callout-text: #e0f2fe;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    /* Reset & Base Settings */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.75;
      min-height: 100vh;
      display: flex;
    }

    ::selection {
      background-color: rgba(56, 189, 248, 0.25);
      color: inherit;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-base);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--brand-accent);
    }

    /* Layout Shell */
    .app-layout {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 320px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 32px 24px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .toc-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    #TOC {
      font-size: 0.88rem;
    }

    #TOC ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #TOC ul ul {
      margin-left: 14px;
      padding-left: 10px;
      border-left: 1px solid var(--border-subtle);
      margin-top: 4px;
      margin-bottom: 4px;
      gap: 2px;
    }

    #TOC a {
      color: var(--text-secondary);
      text-decoration: none;
      display: block;
      padding: 6px 10px;
      border-radius: 6px;
      transition: all 0.15s ease;
      line-height: 1.4;
    }

    #TOC a:hover {
      color: var(--text-primary);
      background: var(--bg-surface-elevated);
      transform: translateX(2px);
    }

    #TOC a.active {
      color: var(--brand-primary);
      font-weight: 600;
      background: var(--brand-badge-bg);
    }

    /* Main Viewport */
    .viewport {
      flex: 1;
      min-width: 0;
      padding: 48px 64px 96px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .content-container {
      width: 100%;
      max-width: 820px;
    }

    /* Top Control Bar */
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      background: var(--brand-badge-bg);
      color: var(--brand-badge-text);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .badge-pill::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }

    .theme-toggle {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .theme-toggle:hover {
      color: var(--text-primary);
      border-color: var(--brand-primary);
    }

    /* Hero Header */
    #title-block-header {
      margin-bottom: 48px;
    }

    #title-block-header h1.title {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.15;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    #title-block-header .subtitle {
      font-size: 1.25rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-subtle);
      padding-top: 16px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Typography & Prose */
    h1, h2, h3, h4, h5, h6 {
      color: var(--text-primary);
      font-weight: 700;
      letter-spacing: -0.02em;
      scroll-margin-top: 32px;
    }

    h1 {
      font-size: 2.1rem;
      margin-top: 56px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    h2 {
      font-size: 1.55rem;
      margin-top: 40px;
      margin-bottom: 16px;
    }

    h3 {
      font-size: 1.25rem;
      margin-top: 28px;
      margin-bottom: 12px;
    }

    p {
      margin-bottom: 18px;
      color: var(--text-secondary);
      line-height: 1.8;
      font-size: 1.02rem;
    }

    strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    ul, ol {
      margin-bottom: 20px;
      padding-left: 24px;
      color: var(--text-secondary);
    }

    li {
      margin-bottom: 8px;
      line-height: 1.7;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border-subtle);
      margin: 48px 0;
    }

    /* Callouts / Blockquotes */
    blockquote {
      background: var(--callout-bg);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--callout-border);
      border-radius: 8px;
      padding: 16px 20px;
      margin: 24px 0;
    }

    blockquote p {
      color: var(--callout-text);
      font-size: 0.95rem;
      margin-bottom: 0;
    }

    blockquote strong {
      color: var(--callout-text);
    }

    /* Inline Code */
    code:not(pre code) {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--code-inline-bg);
      color: var(--code-inline-text);
      padding: 0.15em 0.45em;
      border-radius: 5px;
      font-weight: 500;
    }

    /* Code Blocks */
    .code-wrapper {
      position: relative;
      margin: 24px 0;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-md);
      background: var(--code-bg);
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: #94a3b8;
    }

    .copy-button {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: var(--font-sans);
    }

    .copy-button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    pre {
      padding: 18px 20px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      line-height: 1.6;
      background: var(--code-bg);
      color: var(--code-text);
    }

    pre code {
      background: transparent;
      padding: 0;
      color: inherit;
    }

    /* Tables */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      margin: 28px 0;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      background: var(--bg-surface);
      text-align: left;
    }

    th {
      background: var(--table-header-bg);
      color: var(--text-primary);
      font-weight: 600;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-strong);
      letter-spacing: -0.01em;
    }

    td {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:nth-child(even) td {
      background: var(--table-row-zebra);
    }

    tr:hover td {
      background: var(--table-row-hover);
    }

    /* Floating Back-To-Top */
    .back-to-top {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: all 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }

    .back-to-top.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .back-to-top:hover {
      color: var(--brand-primary);
      border-color: var(--brand-primary);
      transform: translateY(-2px);
    }

    /* Responsive Queries */
    @media (max-width: 1080px) {
      .sidebar {
        display: none;
      }
      .viewport {
        padding: 32px 24px 64px;
      }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    
    <!-- Sidebar / Sticky Table of Contents -->
    <aside class="sidebar">
      <a href="#" class="brand-box">
        <div class="brand-icon">A</div>
        <div>
          <div class="brand-title">ECOSSISTEMA AIDD</div>
          <div class="brand-subtitle">Manual Canônico v3.0</div>
        </div>
      </a>
      
      <div>
        <div class="toc-title">Navegação Rápida</div>
        <nav id="TOC" role="doc-toc">
          $table-of-contents$
        </nav>
      </div>
    </aside>

    <!-- Main Viewport -->
    <main class="viewport">
      <div class="content-container">
        
        <!-- Header Controls -->
        <div class="control-bar">
          <div class="badge-pill">Governança Canônica Certificada • 2026</div>
          <button class="theme-toggle" id="themeBtn" aria-label="Alternar Tema">
            <span id="themeIcon">☀️</span>
            <span id="themeLabel">Modo Claro</span>
          </button>
        </div>

        <!-- Hero Document Header -->
        <header id="title-block-header">
          <h1 class="title">$title$</h1>
          $if(subtitle)$
          <div class="subtitle">$subtitle$</div>
          $endif$
          <div class="meta-row">
            $for(author)$
            <div class="meta-item">
              <span>✍️</span> <strong>$author$</strong>
            </div>
            $endfor$
            $if(date)$
            <div class="meta-item">
              <span>📅</span> $date$
            </div>
            $endif$
            <div class="meta-item">
              <span>🛡️</span> 24 Quality Gates Ativos
            </div>
            <div class="meta-item">
              <span>⚡</span> Tríade Canônica Síncrona
            </div>
          </div>
        </header>

        <!-- Article Prose Content -->
        <article class="prose-content">
          $body$
        </article>

      </div>
    </main>

  </div>

  <!-- Back to top button -->
  <button class="back-to-top" id="backToTop" title="Voltar ao topo" aria-label="Voltar ao topo">↑</button>

  <!-- Interactivity Script -->
  <script>
    // 1. Theme Toggle System
    const htmlEl = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');

    function setTheme(theme) {
      htmlEl.setAttribute('data-theme', theme);
      localStorage.setItem('aidd-theme', theme);
      if (theme === 'dark') {
        themeIcon.textContent = '☀️';
        themeLabel.textContent = 'Modo Claro';
      } else {
        themeIcon.textContent = '🌙';
        themeLabel.textContent = 'Modo Escuro';
      }
    }

    const savedTheme = localStorage.getItem('aidd-theme') || 
      (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    setTheme(savedTheme);

    themeBtn.addEventListener('click', () => {
      const current = htmlEl.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    // 2. Responsive Tables Wrapping
    document.querySelectorAll('table').forEach(table => {
      const wrapper = document.createElement('div');
      wrapper.className = 'table-responsive';
      table.parentNode.insertBefore(wrapper, table);
      wrapper.appendChild(table);
    });

    // 3. Code Blocks Copy & Terminal Decorator
    document.querySelectorAll('pre').forEach((pre, idx) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'code-wrapper';
      
      const header = document.createElement('div');
      header.className = 'code-header';
      
      const code = pre.querySelector('code');
      let lang = 'TERMINAL';
      if (code && code.className) {
        const match = code.className.match(/language-([a-zA-Z0-9_-]+)/);
        if (match) lang = match[1].toUpperCase();
      }
      
      header.innerHTML = `<span>$${lang}</span><button class="copy-button" data-index="$${idx}">Copiar</button>`;
      
      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(header);
      wrapper.appendChild(pre);

      const copyBtn = header.querySelector('.copy-button');
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(code ? code.innerText : pre.innerText);
          copyBtn.textContent = 'Copiado!';
          setTimeout(() => copyBtn.textContent = 'Copiar', 2000);
        } catch(e) {
          copyBtn.textContent = 'Erro';
        }
      });
    });

    // 4. Back to Top Floating Button
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 400) {
        backToTop.classList.add('visible');
      } else {
        backToTop.classList.remove('visible');
      }
    });

    backToTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // 5. ScrollSpy on TOC
    const headings = document.querySelectorAll('article h1, article h2, article h3');
    const tocLinks = document.querySelectorAll('#TOC a');

    window.addEventListener('scroll', () => {
      let currentId = '';
      headings.forEach(heading => {
        const top = heading.getBoundingClientRect().top;
        if (top <= 120) {
          currentId = heading.getAttribute('id');
        }
      });

      if (currentId) {
        tocLinks.forEach(link => {
          if (link.getAttribute('href') === '#' + currentId) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });
      }
    });
  </script>
</body>
</html>
